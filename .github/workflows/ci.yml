name: V2 Foundation CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore KLOP_PLATFORM_V2.sln
      - name: Build
        run: dotnet build KLOP_PLATFORM_V2.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test KLOP_PLATFORM_V2.sln --configuration Release --no-build --logger trx
